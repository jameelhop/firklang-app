  <head>
    <!--
      Basen goer alle relative stier (./sw.js, ./recipes.json, ./cues/...)
      uafhaengige af om siden aabnes med eller uden skraastreg. Noedvendigt
      fordi hopland.dk-proxyen normaliserer /firklang-app/ til /firklang-app,
      og en relativ sti derfra ellers ville ramme domaenets rod.
      Saettes dynamisk, saa en lokal dev-server i roden stadig virker.
    -->
    <script>
      (function () {
        var b = document.createElement("base");
        b.href = location.pathname.indexOf("/firklang-app") === 0 ? "/firklang-app/" : "/";
        document.head.appendChild(b);
      })();
    </script>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover, så det varme sorte går helt ud i kanten på iPhone -->

  <body>
    <div id="root"></div>

    <script>
      /*
        Chrome paa Android viser IKKE laengere en installationsbanner af sig
        selv - den blev fjernet for flere aar siden. Uden en egen knap skal
        brugeren selv finde menupunktet, og det goer ingen.

        Haendelsen fires meget tidligt, ofte foer app-bundlet er indlaest.
        Derfor fanges den her i HTML'en og gemmes, saa React kan bruge den
        naar den er klar.
      */
      window.__firklangInstall = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__firklangInstall = e;
        window.dispatchEvent(new Event("firklang-kan-installeres"));
      });
      window.addEventListener("appinstalled", function () {
        window.__firklangInstall = null;
        window.dispatchEvent(new Event("firklang-installeret"));
      });

      // Registreres først efter load, så den ikke konkurrerer med
      // den første tegning af lysfeltet.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function () {
            // Ingen service worker betyder ingen offline-tilstand.
            // Appen virker stadig — den skal bare have net.
          });
        });
      }
    </script>
  <script src="/firklang-app/_expo/static/js/web/index-3f4920c7357dbf724cc4b51109b88b9b.js" defer></script>
</body>
